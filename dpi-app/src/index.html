<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DPI-VPN Türkiye</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <!-- 1. Durum kartı -->
  <section class="card status-card">
    <span id="dot" class="dot"></span>
    <div class="status-text">
      <h1 id="status" data-i18n="status.stopped">Durduruldu</h1>
      <p id="info" data-i18n="info.stopped">Proxy çalışmıyor</p>
    </div>
  </section>

  <!-- 2. BAŞLAT butonu -->
  <button id="runBtn" class="run-btn start" data-i18n="run.start">BAŞLAT</button>

  <!-- 3. Ayar kartı -->
  <section class="card settings-card">
    <label class="row">
      <span class="row-label"><span data-i18n="cfg.profile">Profil</span> <span class="tip" data-tip-id="tip.profile">?</span></span>
      <select id="profile">
        <option value="turk-telekom">Türk Telekom</option>
        <option value="tt-alternatif">TT Alternatif</option>
        <option value="superonline">Superonline</option>
        <option value="sol-alternatif">SOL Alternatif</option>
        <option value="vodafone">Vodafone</option>
        <option value="turkcell-mobil">Turkcell Mobil</option>
        <option value="vodafone-mobil">Vodafone Mobil</option>
        <option value="telekom-mobil">Telekom Mobil</option>
      </select>
    </label>
    <label class="row">
      <span class="row-label"><span data-i18n="cfg.mode">Mod</span> <span class="tip" data-tip-id="tip.mode">?</span></span>
      <select id="mode">
        <option value="hizli" data-i18n="mode.hizli">Hızlı</option>
        <option value="dengeli" data-i18n="mode.dengeli">Dengeli</option>
        <option value="parcala" data-i18n="mode.parcala">Parçala</option>
      </select>
    </label>
    <label class="row">
      <span class="row-label"><span data-i18n="cfg.delay">Gecikme</span> <span class="tip" data-tip-id="tip.delay">?</span></span>
      <span class="range-wrap">
        <input type="range" id="delay" min="0" max="50" step="1" value="10" />
        <span id="delayVal" class="ms">10 ms</span>
      </span>
    </label>
  </section>

  <!-- 4. Log konsolu -->
  <section class="card log-card">
    <div id="log" aria-live="polite"></div>
  </section>

  <!-- 5. Butonlar -->
  <section class="btn-grid">
    <button id="analyzeBtn" class="btn" data-i18n="btn.analyze">ISS Analizi</button>
    <button id="lanBtn" class="btn" data-i18n="btn.lan">LAN Paylaşım</button>
    <button id="benchBtn" class="btn" data-i18n="btn.bench">Hız Testi</button>
    <button id="sysproxyBtn" class="btn" data-i18n="btn.sysproxy">Sistem Proxy</button>
    <button id="dnsBtn" class="btn" data-i18n="btn.dns">DNS Modu</button>
    <button id="quicBtn" class="btn" data-i18n="btn.quic">QUIC Engelle</button>
  </section>

  <!-- 6. Alt bar -->
  <footer class="bottombar">
    <span id="version">DPI-VPN v1.0.0</span>
    <button id="openSettings" class="btn small">⚙ <span data-i18n="btn.settings">Ayarlar</span></button>
  </footer>
</div>

<!-- Ayarlar modalı -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-box card">
    <h2 data-i18n="set.title">Ayarlar</h2>

    <fieldset>
      <legend data-i18n="set.theme">Tema</legend>
      <label><input type="radio" name="theme" value="light" /> <span data-i18n="set.themeLight">Açık</span></label>
      <label><input type="radio" name="theme" value="dark" /> <span data-i18n="set.themeDark">Koyu</span></label>
      <label><input type="radio" name="theme" value="system" /> <span data-i18n="set.themeSystem">Sistem</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.lang">Dil</legend>
      <label><input type="radio" name="lang" value="tr" /> TR</label>
      <label><input type="radio" name="lang" value="en" /> EN</label>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.behavior">Davranış</legend>
      <label><input type="checkbox" id="optTray" /> <span data-i18n="set.tray">Kapatınca tepsiye küçült</span></label>
      <label><input type="checkbox" id="optCloseProxy" /> <span data-i18n="set.closeProxy">Durdurunca sistem proxy'yi kapat</span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.engine">Motor</legend>
      <label><input type="radio" name="engine" value="rust" /> Rust</label>
      <label><input type="radio" name="engine" value="windivert" /> WinDivert</label>
      <p id="windivertWarn" class="warn-line hidden" data-i18n="set.windivertSoon">WinDivert desteği yakında</p>
    </fieldset>

    <button id="closeSettings" class="btn" data-i18n="set.close">Kapat</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
